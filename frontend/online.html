<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联机 · Xiangqi Council</title><link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="online">
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">象</span><span><strong>Xiangqi Council</strong><small>中国象棋多智能体棋评</small></span></a>
    <nav class="topnav"><a href="index.html">对弈</a><a href="learn.html">学习</a><a class="active" href="online.html">联机</a><a href="tools.html">工具</a></nav>
    <span class="status-pill" id="service-status">联机</span>
  </header>
  <main class="page-main">
    <section class="panel hero">
      <p class="eyebrow">ONLINE</p>
      <h1>联机房间</h1>
      <p>创建或加入房间后，到对弈页实时互下。同网两台设备或两个浏览器窗口即可验证。</p>
    </section>
    <section class="panel online-form">
      <div class="setup" style="justify-content:flex-start;flex-wrap:wrap">
        <label>昵称<input id="player-name" value="玩家" maxlength="24"></label>
        <label>座位
          <select id="seat-color">
            <option value="red">红方</option>
            <option value="black">黑方</option>
          </select>
        </label>
        <button class="accent" id="btn-create" type="button">创建房间</button>
      </div>
      <div class="setup" style="justify-content:flex-start;flex-wrap:wrap;margin-top:12px">
        <label>房间码<input id="room-code" placeholder="六位房间码" maxlength="8"></label>
        <button id="btn-join" type="button">加入房间</button>
        <button id="btn-copy" type="button">复制链接</button>
        <button class="accent" id="btn-goto-play" type="button">进入对弈</button>
      </div>
      <p id="online-status" class="muted" style="margin-top:14px">尚未加入房间</p>
    </section>
  </main>
</div>
<script src="app.js?v=3"></script>
</body>
</html>
